<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avvio Applicativo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0;
    }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 32px; width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 { margin: 0 0 22px 0; font-size: 22px; color: #38bdf8; }
    /* Percorsi completamente nascosti a schermo */
    .path-box { display: none !important; }
    .btn {
      width: 100%; padding: 14px 16px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px;
    }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-green:hover { background: #15803d; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-blue:hover { background: #1d4ed8; }
    .btn-done { background: #334155; color: #86efac; cursor: default; }
    .hint { font-size: 13px; color: #94a3b8; margin-top: 8px; line-height: 1.5; white-space: pre-line; }
    .reset-link {
      display: inline-block; margin-top: 14px; font-size: 12px;
      color: #64748b; cursor: pointer; text-decoration: underline;
    }
    #log {
      margin-top: 12px; font-family: monospace; font-size: 12px; text-align: left;
      color: #fca5a5; white-space: pre-wrap; max-height: 150px; overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="card">
  <h2 id="ui-title">Avvio Applicativo</h2>
  <div class="path-box" id="ui-path"></div>

  <button id="btn-launch" class="btn btn-green" style="display:none;">▶️ AVVIA APPLICATIVO</button>
  <button id="btn-step1" class="btn btn-blue" style="display:none;">1️⃣ COLLEGA CARTELLA APPLICATIVO</button>
  <button id="btn-step2" class="btn btn-blue" style="display:none;">2️⃣ COLLEGA FILE DATABASE</button>

  <div class="hint" id="ui-hint"></div>
  <div id="log"></div>
  <span class="reset-link" id="btn-reset" style="display:none;">⚙️ Riconfigura percorsi</span>
</div>

<script>
window.onerror = function(msg, url, line) {
  var log = document.getElementById('log');
  if (log) log.textContent += '❌ ' + msg + ' (riga ' + line + ')\n';
};
</script>
